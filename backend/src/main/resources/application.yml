spring:
  application:
    name: agm-sentinel-backend
  servlet:
    multipart:
      # Sized for VIDEO uploads (see the `video` block below), which are orders of magnitude
      # larger than the annual-report PDFs this originally covered. Per-endpoint limits are
      # enforced in code — AdminController caps knowledge PDFs, VideoLibraryService caps videos —
      # so raising the container ceiling doesn't loosen the document upload path.
      max-file-size: ${MAX_UPLOAD_SIZE:2GB}
      max-request-size: ${MAX_REQUEST_SIZE:2GB}
      # 0 => always spool to disk. A 2 GB upload must never be buffered in the JVM heap.
      file-size-threshold: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  # Google OAuth is intentionally NOT declared here: an empty client-id fails Spring's
  # validation. To enable "Sign in with Google" in production, set these env vars (Spring
  # auto-configures Google with its built-in provider defaults for endpoints + scopes):
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=<your-client-id>
  #   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=<your-secret>
  # With them unset (e.g. locally), Google login is simply disabled and the app starts normally.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${SPRING_DATASOURCE_USERNAME:sentinel}
    password: ${SPRING_DATASOURCE_PASSWORD:sentinel}
    hikari:
      # SURVIVE A SLEEPING DATABASE AT STARTUP.
      #
      # Serverless Postgres (Neon, Supabase, Aurora Serverless) suspends after inactivity and needs
      # several seconds to resume. HikariCP defaults initialization-fail-timeout to 1 ms — it tries
      # once, fails, and Spring aborts the whole context because entityManagerFactory cannot be
      # built. When the app host ALSO sleeps (any free PaaS), waking both at once hits exactly this:
      # the container comes up, the database is still cold, and the app dies before it can serve a
      # single request. The platform then reports a wake/boot failure, and every browser request
      # returns 502/503 with no CORS headers — which looks like a CORS bug and is not one.
      #
      # A positive timeout makes Hikari keep retrying for that long instead of giving up instantly.
      initialization-fail-timeout: ${DB_INIT_FAIL_TIMEOUT_MS:60000}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      # Small pool: a free-tier instance has little memory, and managed free Postgres tiers cap
      # concurrent connections far below Hikari's default of 10.
      maximum-pool-size: ${DB_MAX_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      # Drop idle connections so a suspending database doesn't leave the pool holding dead sockets.
      idle-timeout: 300000
      max-lifetime: 900000
  jpa:
    hibernate:
      ddl-auto: update # tables also created by ai-service/db/init.sql; update is safe
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  task:
    execution:
      pool:
        # Bound the executor that runs StreamingResponseBody — downloads and transcripts. Spring's
        # default caps it at Integer.MAX_VALUE threads, so a handful of simultaneous downloads could
        # each take a thread and a 1 MB copy buffer with no ceiling at all. Downloads are rare and
        # network-bound; four at once is plenty and the rest queue.
        core-size: 2
        max-size: ${ASYNC_MAX_THREADS:4}
        queue-capacity: 32

server:
  port: ${PORT:8080}
  tomcat:
    # A rejected large upload must not reset the connection: let Tomcat swallow the rest of the
    # request body so the browser receives the 413/400 JSON instead of a network error.
    max-swallow-size: -1
    # Long video uploads over a slow link can exceed the default 20s connection timeout.
    connection-timeout: 300000
    threads:
      # Tomcat defaults to 200 request threads. Each one reserves a stack, and on a 512 MB instance
      # that is memory taken from the only other thing competing for it — the FFmpeg process a
      # transcode spawns. This application serves a meeting: a handful of moderators and viewers,
      # where 20 concurrent requests is already generous. Segment fetches are short and the streaming
      # responses (download, transcript) run on the task executor below, not on these.
      max: ${SERVER_MAX_THREADS:20}
      min-spare: 5

# ---------------------------------------------------------------------------
# Video library — uploads are segmented into an adaptive HLS ladder and streamed
# on demand. Bytes live on the NAS; the DB holds the catalogue + segment index.
# ---------------------------------------------------------------------------
video:
  # WHERE MEDIA BYTES LIVE for new uploads:
  #   filesystem (default) — the NAS share below. Correct whenever durable disk exists.
  #   database             — rows in video_assets. Use when the host has NO persistent volume:
  #                          a free-tier container filesystem is wiped on every redeploy, which
  #                          silently destroys recordings written to it.
  # Recorded per video, so changing this never strands existing recordings.
  storage-mode: ${VIDEO_STORAGE_MODE:filesystem}
  # THE NAS SHARE. Set this in every real environment, e.g.
  #   Windows UNC : VIDEO_NAS_PATH=\\nas01\media\virtual-meeting\videos
  #   Linux mount : VIDEO_NAS_PATH=/mnt/nas/virtual-meeting/videos
  # The service writes a probe file at startup to prove the share is actually writable.
  # Still used as the working directory in database mode: FFmpeg needs real files, so it
  # transcodes here and the output is then ingested and the directory deleted.
  nas-path: ${VIDEO_NAS_PATH:./var/nas/videos}
  # true => refuse to start when the NAS is unreachable (recommended in production).
  # false => log a warning and degrade to `fallback-path` so local dev still works.
  require-nas: ${VIDEO_REQUIRE_NAS:false}
  fallback-path: ${VIDEO_FALLBACK_PATH:./var/videos}
  max-upload-bytes: ${VIDEO_MAX_UPLOAD_BYTES:2147483648}   # 2 GiB
  hls:
    segment-seconds: ${VIDEO_SEGMENT_SECONDS:6}
    # Rungs are capped to the source resolution, so a 720p upload only produces 720p and below.
    ladder: ${VIDEO_LADDER:1080,720,480,360}
    preset: ${VIDEO_X264_PRESET:veryfast}
    # Encode every rung in ONE ffmpeg run (one decode, N simultaneous encoders)? Off by default.
    # One pass is faster in wall-clock terms, but every x264 encoder allocates its buffers at
    # start-up, so peak memory is the sum of the whole ladder and it arrives seconds into the job.
    # That is how a small container ends up killed at 2% of a transcode regardless of how short the
    # video is. Sequential makes the peak the cost of the LARGEST SINGLE RUNG instead, at the price
    # of decoding the source once per rung. Turn on only where there is memory to spare.
    parallel-rungs: ${VIDEO_HLS_PARALLEL_RUNGS:false}
    thumbnail-interval-seconds: ${VIDEO_THUMB_INTERVAL:10}
  tools:
    # Set false to forbid transcoding on this host even if ffmpeg is installed. Transcoding is by
    # far the heaviest thing this app does: a multi-rung H.264 encode will exhaust a small
    # container's memory and get the process killed, which the platform reports as a 502/503 and
    # the browser reports as a CORS error. On a ~512 MB free instance, set this to false and upload
    # MP4 (H.264) or WebM, which browsers play without any conversion.
    enabled: ${VIDEO_TRANSCODE_ENABLED:true}
    # Threads ffmpeg may use (0 = let it decide, i.e. one per HOST core — which is wrong inside a
    # container with a fractional CPU share). Keeping this at 1 stops the encoder starving the JVM
    # of CPU, which is what makes a platform health check time out and restart the container in the
    # middle of a transcode.
    threads: ${VIDEO_FFMPEG_THREADS:1}
    # Scheduling priority for ffmpeg, 0 (normal) to 19 (lowest). Linux only; ignored if `nice` is
    # missing. Capping threads limits how much work ffmpeg does at once; this limits how much it
    # does at the JVM's expense. On a fractional-CPU instance that is the difference between the
    # health check still being answered during a transcode and the platform restarting the
    # container because it went unanswered. 0 disables.
    niceness: ${VIDEO_FFMPEG_NICENESS:15}
    # FFmpeg does the segmentation. Without it, uploads still play — served progressively over
    # HTTP Range instead of as an adaptive ladder — and can be re-processed once it's installed.
    ffmpeg: ${FFMPEG_PATH:ffmpeg}
    ffprobe: ${FFPROBE_PATH:ffprobe}
    workers: ${VIDEO_WORKERS:1}
    timeout-minutes: ${VIDEO_TIMEOUT_MINUTES:240}
  playback:
    ticket-ttl-seconds: ${VIDEO_TICKET_TTL:21600}   # 6h — long enough for one sitting
  database:
    # These only apply when storage-mode=database. A database is not bulk storage, so database
    # mode is for SHORT recordings and enforces its own, much smaller limits.
    #
    # Per-upload ceiling, checked before the bytes are accepted so an over-sized file fails in
    # seconds instead of after a multi-minute transcode.
    max-upload-bytes: ${VIDEO_DB_MAX_UPLOAD_BYTES:209715200}    # 200 MiB
    # Total budget across every video. Uploads are refused once it is reached, rather than being
    # allowed to fill the database. Lower this to match a managed free tier (Neon allows 0.5 GiB).
    max-total-bytes: ${VIDEO_DB_MAX_TOTAL_BYTES:2147483648}     # 2 GiB
    # Source-size → stored-size multiplier, used only to reject an upload up-front when it clearly
    # will not fit. Measured: a 13.2 MB 720p source produced 26.1 MB across three rungs.
    size-estimate-factor: ${VIDEO_DB_SIZE_FACTOR:2.0}
    # Segments are a few MB each, so this is generous for HLS output; the limit exists to catch
    # the case that would otherwise buffer a whole un-segmented recording in heap (no FFmpeg).
    max-asset-bytes: ${VIDEO_DB_MAX_ASSET_BYTES:67108864}       # 64 MiB
    # Keep the original upload in the database as well as the segments? Off by default: it is
    # only needed to re-process, and it is far larger than every segment combined.
    keep-source: ${VIDEO_DB_KEEP_SOURCE:false}
    # Move each finished segment into the database while FFmpeg is still encoding, instead of
    # ingesting the whole ladder in one transaction at the end. On by default: the one-pass ingest
    # holds every produced file in heap until it commits, so its cost grows with the length of the
    # recording and a long upload will OOM a small container. Draining bounds heap and disk to a
    # single segment. Only set false to reproduce the old behaviour.
    drain-segments: ${VIDEO_DB_DRAIN_SEGMENTS:true}
    # How often the drain sweeps for finished segments.
    drain-sweep-seconds: ${VIDEO_DB_DRAIN_SWEEP_SECONDS:5}

# Python AI service base URL (Docker: http://ai-service:8000 ; HF Spaces URL in prod)
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-string-in-prod-please}
  legacy-secret: ${JWT_LEGACY_SECRET:}
  legacy-secrets: ${JWT_LEGACY_SECRETS:}
  # INACTIVITY timeout: 8 hours (28800s). The token's lifetime IS the idle window — the browser
  # renews it (POST /api/auth/refresh-session) while the user is doing things and stops when they
  # are not, so a session ends 8 hours after the last activity rather than 8 hours after sign-in.
  #
  # Enforced by the server, because renewal requires a token that has not yet expired. No session
  # table is involved: an abandoned session needs no cleanup, it simply stops being renewed. The
  # frontend also schedules its own logout from the token's `exp` (AuthService.scheduleExpiry) so a
  # lapsed session leaves the UI immediately instead of lingering until some request happens to 401.
  ttl-seconds: ${JWT_TTL_SECONDS:28800}
  # Ceiling on total session length regardless of activity: 24 hours. Sliding expiry on its own
  # means a browser left open never re-authenticates, so the renewed token carries the original
  # sign-in time (`ost`) and renewal is refused past this. 0 disables the cap.
  max-session-seconds: ${JWT_MAX_SESSION_SECONDS:86400}

# Where the SPA lives — Google OAuth bounces the browser back here with the token.
app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}

# Passwordless email/SMS OTP. demo-mode=true → codes are logged + returned in the API
# response (free, no email/SMS provider). Set false + wire a real OtpDelivery bean for prod.
otp:
  demo-mode: ${OTP_DEMO_MODE:true}
  ttl-seconds: 300
  # Real SMS delivery. Leave provider empty → demo (code shown on screen). To send real texts:
  #   OTP_DEMO_MODE=false, OTP_SMS_PROVIDER=textbelt|fast2sms, OTP_SMS_API_KEY=<key>
  #   textbelt: use key "textbelt" for 1 free SMS/day (global, no signup).
  #   fast2sms: free India signup, get your API key from the dashboard.
  sms:
    provider: ${OTP_SMS_PROVIDER:}
    api-key: ${OTP_SMS_API_KEY:}

# WebAuthn (passkeys). rp-id + origins MUST match the FRONTEND domain (where the browser runs
# the ceremony). Defaults are for local dev; set env vars in prod to the Vercel domain, e.g.
#   WEBAUTHN_RP_ID=agm-sentinel-xxxx.vercel.app
#   WEBAUTHN_ORIGINS=https://agm-sentinel-xxxx.vercel.app
webauthn:
  rp-id: ${WEBAUTHN_RP_ID:localhost}
  rp-name: ${WEBAUTHN_RP_NAME:AGM Sentinel}
  origins: ${WEBAUTHN_ORIGINS:http://localhost:4200}

# Question ingest path:
#   "http"  → call the AI service /ingest synchronously (default, simplest, no broker)
#   "kafka" → produce each question to the durable `questions.incoming` log; the AI service
#             consumes it and replays it on restart to rebuild clusters (event sourcing).
queue:
  mode: ${QUEUE_MODE:http}
  kafka:
    questions-topic: ${KAFKA_QUESTIONS_TOPIC:questions.incoming}

board:
  refresh-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health
